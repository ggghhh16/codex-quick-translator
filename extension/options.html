<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="settingsTitle"></title><link rel="stylesheet" href="options.css"></head>
<body><main><header><div class="logo" aria-hidden="true">文</div><div><h1 data-i18n="appName"></h1><p data-i18n="tagline"></p></div></header>
<div class="connection" id="connection" role="status" data-i18n="connecting"></div>
<form id="settings"><label for="target-language" data-i18n="targetLanguage"></label><select id="target-language"><option data-i18n="loading"></option></select><input id="custom-language" dir="ltr" data-i18n-placeholder="languageCode" data-i18n-aria="languageCodeLabel" maxlength="50" hidden><p class="hint" data-i18n="targetHint"></p>
<label for="model" data-i18n="model"></label><select id="model" disabled><option data-i18n="loading"></option></select>
<label for="effort" data-i18n="effort"></label><select id="effort" disabled><option data-i18n="loading"></option></select><p class="hint" data-i18n="effortHint"></p>
<div class="row"><div><label for="fast" id="fast-label" data-i18n="fastMode"></label><p class="hint" data-i18n="speedHint"></p></div><input type="checkbox" role="switch" id="fast" checked></div>
<p class="hint" id="effective" data-i18n="capabilitiesHint"></p>
<label for="path" data-i18n="notesPath"></label><input id="path" dir="ltr" placeholder="D:\Notes\translations.md" required spellcheck="false"><p class="hint" data-i18n="notesHint"></p>
<button type="submit" id="save" disabled data-i18n="saveSettings"></button></form><p id="status" role="status" aria-live="polite"></p>
<section><h2 data-i18n="startReading"></h2><ol><li data-i18n="stepSelect"></li><li data-i18n="stepTranslate"></li><li data-i18n="stepSave"></li></ol></section>
<details id="help"><summary data-i18n="helpTitle"></summary><p data-i18n="installIntro"></p><p><a href="https://github.com/ggghhh16/codex-quick-translator/releases/latest" target="_blank" rel="noopener noreferrer" data-i18n="downloadCompanion"></a></p><p dir="ltr"><code id="install-command"></code></p><p data-i18n="requirements"></p><p data-i18n="privacyLong"></p><p data-i18n="limitations"></p><p data-i18n="independent"></p><p><a href="https://github.com/ggghhh16/codex-quick-translator/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer" data-i18n="privacyPolicy"></a> · <a href="https://github.com/ggghhh16/codex-quick-translator/issues" target="_blank" rel="noopener noreferrer" data-i18n="support"></a></p><p id="extension-id" dir="ltr"></p></details>
</main><script src="i18n.js"></script><script src="languages.js"></script><script src="settings-ui.js"></script><script src="options.js"></script></body></html>
